name: Proton VPN Automated COPR Builder

on:
  schedule:
    # ProtonVPN Merkezi Cenevre Saati (CET): Öğle 12:00 (11:00 UTC) ve İş Çıkışı 17:00 (16:00 UTC)
    - cron: '0 11,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. AŞAMA: Güncel Sürüm Kontrolü
  check-update:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    outputs:
      new_version_found: ${{ steps.compare.outputs.new_version_found }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Upstream Version
        id: compare
        run: |
          cat << 'EOF' > /etc/yum.repos.d/protonvpn.repo
          [protonvpn-fedora-stable]
          name=ProtonVPN Fedora Stable
          baseurl=https://repo.protonvpn.com/fedora-44-stable/
          enabled=1
          gpgcheck=0
          EOF
          
          # Tüm zincirdeki paketlerin sürüm ve release bilgilerinden ortak bir parmak izi (hash) üret
          UPSTREAM_HASH=$(dnf repoquery --disablerepo="*" --enablerepo="protonvpn-fedora-stable" --qf "%{name}-%{version}-%{release}\n" \
            protonvpn-stable-release \
            python3-proton-core \
            python3-proton-keyring-linux \
            python3-proton-vpn-network-manager \
            python3-proton-vpn-local-agent \
            python3-proton-vpn-api-core \
            proton-vpn-daemon \
            proton-vpn-cli \
            proton-vpn-gtk-app \
            proton-vpn-gnome-desktop \
            | sort | sha256sum | awk '{print $1}')
          
          LOCAL_HASH=$(cat VERSION 2>/dev/null || echo "0")
          
          echo "Upstream Fingerprint: $UPSTREAM_HASH"
          echo "Local Fingerprint:    $LOCAL_HASH"
          
          if [ "$UPSTREAM_HASH" != "$LOCAL_HASH" ] && [ -n "$UPSTREAM_HASH" ]; then
            echo "Güncelleme bulundu! Pipeline çalıştırılıyor..."
            echo "new_version_found=true" >> $GITHUB_OUTPUT
            echo "upstream_hash=$UPSTREAM_HASH" >> $GITHUB_OUTPUT
          else
            echo "Herhangi bir pakette değişiklik yok."
            echo "new_version_found=false" >> $GITHUB_OUTPUT
          fi

  # 2. ve 3. AŞAMA: İndirme, Paketleme ve COPR'a Gönderme (Sadece yeni sürüm varsa çalışır)
  build-and-deploy:
    needs: check-update
    if: needs.check-update.outputs.new_version_found == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Install Build Dependencies & Tools
        run: |
          dnf install -y \
            rpm-build \
            rpmdevtools \
            copr-cli \
            git \
            python3 \
            python3-pip \
            cpio \
            curl \
            glib2-devel \
            dnf-plugins-core

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure COPR Credentials
        run: |
          mkdir -p ~/.config
          cat << 'EOF' > ~/.config/copr
          [copr-cli]
          login = ${{ secrets.COPR_LOGIN }}
          username = universish
          token = ${{ secrets.COPR_TOKEN }}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          chmod 600 ~/.config/copr

      - name: Run Orchestrator (Fetch, Repackage, COPR Build)
        run: |
          chmod +x scripts/orchestrator.py
          python3 scripts/orchestrator.py
          
          # Başarılı derlemeden sonra yeni sürümü VERSION dosyasına kaydet
          UPSTREAM_VERSION=$(dnf repoquery --disablerepo="*" --enablerepo="protonvpn-fedora-stable" --qf "%{version}" proton-vpn-gnome-desktop | sort -V | tail -n 1)
          # Başarılı derlemeden sonra yeni parmak izini VERSION dosyasına kaydet
          echo "${{ steps.compare.outputs.upstream_hash }}" > VERSION

      - name: Commit Updated Version, Release and Specs
        run: |
          # Container içi yetki uyuşmazlığını gider
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add VERSION RELEASE_NUM specs/*.spec
          
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            VERSION_VAL=$(cat VERSION)
            RELEASE_VAL=$(cat RELEASE_NUM 2>/dev/null || echo "1")
            git commit -m "Auto-bump: ProtonVPN to ${VERSION_VAL}-${RELEASE_VAL} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
